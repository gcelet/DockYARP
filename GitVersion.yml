# DockYarp follows GitFlow: `develop` is the long-lived trunk, `main` holds releases (v* tags), with
# feature/release/hotfix branches. The version comes from the base + git height + tags, not commit messages
# (the repo uses gitmoji, which GitVersion does not parse as semver bumps).
workflow: GitFlow/v1
next-version: 0.1.0
commit-message-incrementing: Disabled
branches:
  pull-request:
    label: pr
