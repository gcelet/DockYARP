schema: spec-driven

context: |
  DockYarp — dynamic reverse proxy for Docker containers (an nginx-proxy equivalent),
  built on YARP and .NET 10 / C#.

  Tech stack: .NET 10, ASP.NET Core (Kestrel), YARP (reverse proxy), Docker.DotNet (discovery),
  ACME v2 / Let's Encrypt (TLS), NUnit 4 + AwesomeAssertions (tests).

  Solution layout (see AGENTS.md for the authority):
    src/DockYarp.Core      domain models, interfaces, stores (leaf project)
    src/DockYarp.Docker    Docker discovery + label mapping        -> Core
    src/DockYarp.Tls       ACME + certificates                     -> Core
    src/DockYarp.Security  HTTPS enforcement, auth                 -> Core
    src/DockYarp.AdminApi  admin/observability endpoints           -> Core
    src/DockYarp.App       ASP.NET host: YARP, DI, pipeline        -> everything
    tests/*                   one *.Tests project per src project

  Conventions (enforced — do not restate rules, point to config):
    - Coding standards live in AGENTS.md; severities in .editorconfig; build props in
      Directory.Build.props; package versions in Directory.Packages.props (Central Package Management).
    - TreatWarningsAsErrors=true, Nullable=enable, XML docs required. Modern C# (file-scoped
      namespaces, primary constructors, collection expressions, pattern matching, records).
    - Async/await end-to-end on I/O; low allocation on the proxy hot path (Span/Memory, ArrayPool,
      explicit StringComparison, sealed by default).
    - English everywhere in committed files. Comments justify "why"; XML <summary> short, details in <remarks>.

  Domain agents (owning roles referenced in tasks):
    AG-RP proxy/YARP · AG-DD Docker discovery/labels · AG-AT ACME/TLS/Kestrel ·
    AG-SEC security/auth · AG-AA Admin API/observability · AG-DEP packaging/image/compose/CI.

  Label compatibility target (nginx-proxy): VIRTUAL_HOST, VIRTUAL_PORT, VIRTUAL_PATH,
  LETSENCRYPT_HOST, LETSENCRYPT_EMAIL. DockYarp-specific labels use the DOCKYARP_ prefix.

  Roadmap (phases → changes): docker-discovery, yarp-dynamic-config, tls-acme, security-middleware,
  admin-api, deployment. Dependency note: the Core routing/cluster model (proxy-routing) is a
  prerequisite for docker-discovery (label mapping writes into that model), so it comes first.

  The original cross-cutting requirements are delivered (startup reconciliation, static configuration,
  backend health checks, observability, TLS default/fallback cert, HSTS + security headers, graceful
  shutdown). The live feature backlog vs nginx-proxy now lives in openspec/backlog/: parity.md is the
  source-of-truth parity matrix and each gap has an items/<id>.md stub, promotable 1:1 via /opsx:propose <id>.

  Change lifecycle (every change): backlog item -> /opsx:propose <id> -> /opsx:apply -> commit ->
  /opsx:archive -> remove the item from the backlog and flip its parity.md row. See AGENTS.md "Change lifecycle".

rules:
  proposal:
    - State impacted capabilities and affected src/tests projects explicitly.
  tasks:
    - Order tasks so Core domain types precede code that maps into them.
    - Tag each task group with the owning domain agent (AG-RP, AG-DD, AG-AT, AG-SEC, AG-AA, AG-DEP).
    - Include unit tests (NUnit + AwesomeAssertions) and, for pipeline behavior, integration tests.
