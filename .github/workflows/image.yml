name: Publish image

on:
  push:
    tags: ['v*']
    branches: [develop]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish (defaults to the pushed git tag)
        required: false

# `packages: write` is needed for the GHCR default; a custom registry uses the credential secrets below.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Release path: a v* tag push (or a manual re-run) — computed tag set (stable: X.Y.Z+X.Y+X+latest;
  # prerelease: X.Y.Z-<pre> only), decided by the Fallout DockerPublish target from the resolved version.
  publish-release:
    name: Build & push image (release)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion (run by the Fallout build during DockerPublish) needs the full history + tags.
          fetch-depth: 0

      # Resolve the target registry/repository/version. External values flow through env (never interpolated
      # into the script) so a crafted tag or dispatch input cannot inject shell.
      - name: Resolve target
        id: cfg
        env:
          IN_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IN_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          DEFAULT_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          registry="${IN_REGISTRY:-ghcr.io}"
          repository="${IN_REPOSITORY:-$DEFAULT_REPOSITORY}"
          version="${IN_TAG:-${REF_NAME#v}}"
          {
            echo "registry=$registry"
            echo "repository=${repository,,}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET (for the Fallout build)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Same key as ci.yml's cache step, verbatim — GitHub Actions cache scope is per-repository, not
      # per-workflow, so a matching key shares the entry with ci.yml's restore (and vice versa) instead of
      # each workflow downloading NuGet packages independently on every push.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Default registry is GHCR (github.actor + GITHUB_TOKEN). Point IMAGE_REGISTRY at any other registry —
      # including a private, non-Docker-Hub one — and set REGISTRY_USERNAME/REGISTRY_PASSWORD to publish there.
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.cfg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # DockerPublish itself now depends on Test + E2E (build/Build.cs) and never sets --skip-publish-gate here,
      # so this single call gates the release on both before pushing — no orchestration logic in this workflow.
      - name: Test, E2E, and push (Fallout)
        env:
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          REPOSITORY: ${{ steps.cfg.outputs.repository }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: ./build.sh DockerPublish --registry "$REGISTRY" --image-repository "$REPOSITORY" --version "$VERSION" --platforms linux/amd64,linux/arm64

      # The E2E target writes each Aspire resource's own logs here (stepca.log, ca-bundle.log, dockerproxy.log,
      # ...), but the runner is torn down after the job ends — without this, a CI-only E2E failure is only ever
      # diagnosable from dockyarp.log's console tail (the target's own on-failure summary), never the other
      # resources' logs. Only runs on failure so successful releases carry no extra artifact.
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: artifacts/e2e-logs/
          if-no-files-found: ignore

      # Both steps inspect the image just pushed above by registry reference — no separate rebuild.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.cfg.outputs.registry }}/${{ steps.cfg.outputs.repository }}:${{ steps.cfg.outputs.version }}
          format: spdx-json
          upload-artifact: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.cfg.outputs.registry }}/${{ steps.cfg.outputs.repository }}:${{ steps.cfg.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

  # Edge path: a push to the trunk branch, no tag. No --version override — GitVersion resolves the
  # in-development prerelease version the same way it already does for build-time stamping.
  publish-edge:
    name: Build & push image (edge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion (run by the Fallout build during DockerPublish) needs the full history + tags.
          fetch-depth: 0

      - name: Resolve target
        id: cfg
        env:
          IN_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IN_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          DEFAULT_REPOSITORY: ${{ github.repository }}
        run: |
          registry="${IN_REGISTRY:-ghcr.io}"
          repository="${IN_REPOSITORY:-$DEFAULT_REPOSITORY}"
          {
            echo "registry=$registry"
            echo "repository=${repository,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET (for the Fallout build)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Same key as ci.yml's cache step, verbatim — GitHub Actions cache scope is per-repository, not
      # per-workflow, so a matching key shares the entry with ci.yml's restore (and vice versa) instead of
      # each workflow downloading NuGet packages independently on every push.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.cfg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # --skip-publish-gate: edge exists for fast in-development signal on every trunk push; DockerPublish now
      # gates on Test/E2E by default (see the release job below), which would slow every trunk commit for a
      # channel whose whole purpose is speed. Ordinary unit/integration coverage still runs via ci.yml.
      - name: Build & push (Fallout DockerPublish --edge)
        env:
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          REPOSITORY: ${{ steps.cfg.outputs.repository }}
        run: ./build.sh DockerPublish --registry "$REGISTRY" --image-repository "$REPOSITORY" --edge --skip-publish-gate --platforms linux/amd64,linux/arm64

      # Mirrors the release job's own step below — --skip-publish-gate is meant to skip Test/E2E here (see the
      # comment above), but a real 2026-08-23 CI failure showed E2E running and failing on this job anyway
      # (root cause not yet confirmed — this step exists so the next failure is diagnosable at all, since
      # per-resource logs were previously only ever visible in the runner's own torn-down filesystem).
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: artifacts/e2e-logs/
          if-no-files-found: ignore

      # No SBOM step here (release-only, see design.md) — the edge channel still gets scanned so
      # vulnerabilities surface as early as the in-development image, not only at release time.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.cfg.outputs.registry }}/${{ steps.cfg.outputs.repository }}:edge
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore
