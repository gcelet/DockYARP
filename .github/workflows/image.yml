name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to the pushed git tag)
        required: false

# `packages: write` is needed for the GHCR default; a custom registry uses the credential secrets below.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion (run by the Nuke build during DockerPublish) needs the full history + tags.
          fetch-depth: 0

      # Resolve the target registry/repository/version. External values flow through env (never interpolated
      # into the script) so a crafted tag or dispatch input cannot inject shell.
      - name: Resolve target
        id: cfg
        env:
          IN_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IN_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          DEFAULT_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          registry="${IN_REGISTRY:-ghcr.io}"
          repository="${IN_REPOSITORY:-$DEFAULT_REPOSITORY}"
          version="${IN_TAG:-${REF_NAME#v}}"
          {
            echo "registry=$registry"
            echo "repository=${repository,,}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET (for the Nuke build)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Default registry is GHCR (github.actor + GITHUB_TOKEN). Point IMAGE_REGISTRY at any other registry —
      # including a private, non-Docker-Hub one — and set REGISTRY_USERNAME/REGISTRY_PASSWORD to publish there.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.cfg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # Delegate the actual build+push to the single Nuke image path (no duplicated build logic here); it
      # buildx-builds the multi-arch manifest and pushes :{version} + :latest to the resolved registry.
      - name: Build & push (Nuke DockerPublish)
        env:
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          REPOSITORY: ${{ steps.cfg.outputs.repository }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: ./build.sh DockerPublish --registry "$REGISTRY" --image-repository "$REPOSITORY" --image-tag "$VERSION" --platforms linux/amd64,linux/arm64
