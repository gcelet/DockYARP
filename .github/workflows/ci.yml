name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Least privilege: the build-and-test gate only reads the repository.
permissions:
  contents: read

# Supersede in-flight runs on the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion (run by the Fallout build) needs the full history + tags to compute the version;
          # the default shallow clone makes it fall back to a static version.
          fetch-depth: 0

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The Fallout Test gate: Restore -> Compile (whole solution) -> unit + integration tests.
      # Warnings are errors; the Aspire end-to-end suite (needs Docker) is intentionally not run here.
      - name: Build & test
        run: ./build.sh Test
