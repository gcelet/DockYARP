name: GHCR image retention

on:
  schedule:
    # Sunday, 03:00 UTC — matches this project's evening-only/low-cadence development rhythm; the package only
    # meaningfully grows on active development days, so a weekly sweep is enough.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Prune superseded edge tags
    runs-on: ubuntu-latest
    steps:
      # Every DockYarp release tag (X, X.Y, X.Y.Z, latest) and `edge` itself never contain a hyphen; every
      # GitVersion-resolved edge-prerelease tag always does (semver's own "-" separator, e.g.
      # "0.1.0-alpha.223"). image-tags: "*-*" is therefore a positive filter for exactly the tags that should
      # ever be deleted — no keep-list to enumerate or maintain as the release tag scheme evolves elsewhere.
      # dry-run: false — validated across three real runs (32414866147 investigation, 32415763262, 32416211579
      # debug trace, 32416645294 post-revert) with a stable, correct, explicitly user-reviewed deletion list
      # before this was flipped.
      - name: Prune superseded edge prerelease tags
        uses: snok/container-retention-policy@v3.1.0
        with:
          # Literal "user", not github.repository_owner: gcelet is a personal account, not an organization —
          # passing the owner name here made the action call the organization-scoped list-packages endpoint,
          # which 404s for a personal account (confirmed live, run 32414866147).
          account: user
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: dockyarp
          image-tags: '*-*'
          tag-selection: tagged
          cut-off: 3d
          dry-run: false
