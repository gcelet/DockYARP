# Reference stack: DockYarp in front of a labeled sample service.
# Local demo uses HTTP (real ACME/TLS needs public DNS). See docs/deployment.md.
#
# DockYarp runs as a non-root container and reaches the Docker API through a read-only socket proxy
# (recommended). Only the proxy mounts the Docker socket. For the direct-socket alternative (group_add),
# see examples/docker-compose.group-add.yml.
services:
  # Minimal, read-only Docker API gateway; the only component that touches the socket.
  dockerproxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      # Discovery needs to list/inspect containers; the image enables the event stream by default.
      CONTAINERS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  dockyarp:
    # Builds and tags the local image. To use the published image instead, drop `build:` and set
    # `image: ghcr.io/gcelet/dockyarp`.
    build:
      context: .
      dockerfile: Dockerfile
    image: dockyarp:local
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      # Enable Docker discovery (off by default outside the reference stack).
      Docker__Enabled: "true"
      # Reach the Docker API via the proxy, so DockYarp needs no socket mount and stays non-root.
      Docker__DockerEndpoint: "tcp://dockerproxy:2375"
      AdminApi__ApiKey: "change-me"
      # Surface off by default (AdminApi:Surface: Disabled); "Api" here + a bare Host (any port) so the
      # admin API is reachable locally without picking a specific port. Set this to "ApiAndDashboard" instead
      # to also serve the read-only admin dashboard at /dashboard on the same host.
      AdminApi__Surface: "Api"
      AdminApi__Host: "localhost"
    volumes:
      # Named volume for persistent state: it inherits the image's app-owned /certs, so the non-root
      # container can write it (a host bind mount would re-impose host ownership and break the write).
      - certs:/certs
      # This reference stack routes purely from Docker labels (see the `whoami` service below). DockYarp can
      # instead (or additionally) be configured from a static JSON file — bind-mount it and set
      # `StaticConfig__Path` to its in-container path if you want that; see
      # https://gcelet.github.io/DockYARP/docs/features/#static-configuration.
    depends_on:
      - dockerproxy
    restart: unless-stopped

  whoami:
    image: traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    labels:
      VIRTUAL_HOST: "whoami.local"
      VIRTUAL_PORT: "80"
      # Automatic HTTPS (ACME/Let's Encrypt) is opt-in per host — left inactive here since it needs a real,
      # publicly resolvable domain with ports 80/443 reachable from the internet (whoami.local is neither).
      # Uncomment and replace with your own domain/email to see it provision a certificate for real:
      # LETSENCRYPT_HOST: "whoami.example.com"
      # LETSENCRYPT_EMAIL: "admin@example.com"

volumes:
  # DockYarp's persistent state (certificates + Data Protection keys). A named volume inherits the image's
  # app-owned /certs so the non-root container can write it and the data survives container recreation.
  certs:
